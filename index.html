<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>City & Soldier Explorer</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; touch-action: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Loading Screen UI */
        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, #1a1a1a, #2c3e50);
            color: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 999;
            transition: opacity 1s ease-out;
        }
        .status-text { margin-top: 10px; font-size: 14px; color: #aaa; }

        /* Controls */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* Joystick (Left) */
        #zone_joystick {
            position: absolute; bottom: 40px; left: 40px; width: 140px; height: 140px;
            pointer-events: auto; background: rgba(255, 255, 255, 0.05); border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.1);
        }

        /* Look Zone (Right) */
        #zone_look {
            position: absolute; top: 0; right: 0; width: 50%; height: 100%;
            pointer-events: auto;
        }

        /* Debug Info */
        #debug {
            position: absolute; top: 10px; left: 10px; color: yellow; 
            background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 5px;
            font-size: 12px; pointer-events: none;
        }
    </style>
    
    <!-- Three.js Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>
</head>
<body>

    <div id="loader">
        <h2>Initializing Game World...</h2>
        <div id="status-city" class="status-text">Waiting for City Map...</div>
        <div id="status-player" class="status-text">Waiting for Soldier...</div>
    </div>
    
    <div id="debug">System: Starting...</div>

    <div id="ui-layer">
        <div id="zone_joystick"></div>
        <div id="zone_look"></div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const CONFIG = {
            cityFile: 'futuristic_city.glb',
            playerFile: 'soldier_human.glb', // GitHub filename
            cityScale: 5,   // Agar city choti dikhe to isse badhayen (e.g., 10)
            playerScale: 1, // Agar soldier chota dikhe to isse badhayen
            walkSpeed: 6
        };

        const debugEl = document.getElementById('debug');
        function log(msg) { console.log(msg); debugEl.innerHTML = msg; }
        
        // --- 1. SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 
        scene.fog = new THREE.Fog(0x87CEEB, 20, 100); // Door ki cheezein dhundhli hongi

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.outputEncoding = THREE.sRGBEncoding; // Better colors
        document.body.appendChild(renderer.domElement);

        // --- 2. LIGHTING (Very Important) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7); // Base light
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.5); // Sun
        sunLight.position.set(50, 100, 50);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048; 
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        // Fallback Grid (Zameen agar city na load ho)
        const gridHelper = new THREE.GridHelper(100, 100, 0x000000, 0x555555);
        gridHelper.position.y = -0.1; 
        scene.add(gridHelper);

        // --- 3. VARIABLES ---
        let player, mixer;
        let city;
        const clock = new THREE.Clock();
        
        let joystickData = { angle: 0, force: 0 };
        let camRot = { x: -0.3, y: Math.PI }; // Camera angles
        let camDist = 5; 

        // --- 4. ASSET LOADING ---
        const loader = new THREE.GLTFLoader();
        let loadedCount = 0;

        function checkLoadComplete() {
            loadedCount++;
            if(loadedCount >= 2) {
                const loaderScreen = document.getElementById('loader');
                loaderScreen.style.opacity = '0';
                setTimeout(() => loaderScreen.style.display = 'none', 1000);
                log("All Assets Loaded. Ready!");
                animate();
            }
        }

        // A. LOAD CITY MAP
        loader.load(CONFIG.cityFile, (gltf) => {
            city = gltf.scene;
            city.scale.set(CONFIG.cityScale, CONFIG.cityScale, CONFIG.cityScale);
            city.position.set(0, 0, 0);
            
            // Shadows enable karna
            city.traverse((node) => {
                if (node.isMesh) {
                    node.receiveShadow = true;
                    // Kabhi kabhi city model transparency ki wajah se gayab ho jata hai, use fix karein:
                    node.material.side = THREE.DoubleSide; 
                }
            });
            
            scene.add(city);
            document.getElementById('status-city').innerText = "✅ City Map Loaded";
            document.getElementById('status-city').style.color = "#0f0";
            checkLoadComplete();
        }, 
        (xhr) => { log(`Loading City: ${Math.round(xhr.loaded/xhr.total*100)}%`); },
        (err) => { 
            console.error(err); 
            document.getElementById('status-city').innerText = "❌ City Load Failed (Check Filename)";
            document.getElementById('status-city').style.color = "red";
            // Agar fail hua, tab bhi game start karein taaki soldier dikhe
            checkLoadComplete(); 
        });

        // B. LOAD SOLDIER
        loader.load(CONFIG.playerFile, (gltf) => {
            player = gltf.scene;
            player.scale.set(CONFIG.playerScale, CONFIG.playerScale, CONFIG.playerScale);
            player.position.set(0, 0, 0); // Start position

            player.traverse((node) => {
                if (node.isMesh) node.castShadow = true;
            });

            // Animations setup
            mixer = new THREE.AnimationMixer(player);
            if(gltf.animations.length > 0) {
                // Pehli animation (usually Idle ya Walk hoti hai) play karein
                mixer.clipAction(gltf.animations[0]).play();
            }

            scene.add(player);
            document.getElementById('status-player').innerText = "✅ Soldier Loaded";
            document.getElementById('status-player').style.color = "#0f0";
            checkLoadComplete();
        }, 
        (xhr) => { log(`Loading Soldier: ${Math.round(xhr.loaded/xhr.total*100)}%`); },
        (err) => { 
            console.error(err);
            document.getElementById('status-player').innerText = "❌ Soldier Load Failed";
            // Fallback Box banayein agar soldier fail ho jaye
            const geo = new THREE.BoxGeometry(1, 2, 1);
            const mat = new THREE.MeshStandardMaterial({color: 'red'});
            player = new THREE.Mesh(geo, mat);
            scene.add(player);
            checkLoadComplete();
        });

        // --- 5. CONTROLS SETUP ---
        
        // Joystick
        const joystick = nipplejs.create({
            zone: document.getElementById('zone_joystick'),
            mode: 'static',
            position: { left: '50%', top: '50%' },
            color: 'white'
        });

        joystick.on('move', (evt, data) => {
            joystickData.angle = data.angle.radian;
            joystickData.force = Math.min(data.force, 1.5);
        });
        joystick.on('end', () => { joystickData.force = 0; });

        // Touch Camera Look
        const lookZone = document.getElementById('zone_look');
        let prevTouch = { x: 0, y: 0 };
        
        lookZone.addEventListener('touchstart', (e) => {
            prevTouch.x = e.touches[0].clientX;
            prevTouch.y = e.touches[0].clientY;
        });

        lookZone.addEventListener('touchmove', (e) => {
            const x = e.touches[0].clientX;
            const y = e.touches[0].clientY;
            
            // Sensitivity
            const sensitivity = 0.004;
            camRot.y -= (x - prevTouch.x) * sensitivity;
            camRot.x -= (y - prevTouch.y) * sensitivity;
            
            // Limit Vertical Look (Gardan tootne se bachayein)
            camRot.x = Math.max(-0.8, Math.min(0.5, camRot.x));

            prevTouch.x = x;
            prevTouch.y = y;
        });

        // --- 6. GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if(player) {
                // Movement Logic
                if(joystickData.force > 0) {
                    // Joystick angle nipplejs mein math ke hisaab se hota hai, 
                    // humein ise camera ke hisaab se adjust karna padega
                    
                    // NippleJS 0 radians = Right. ThreeJS Forward = Z.
                    // Isliye +90 degree (PI/2) add karte hain + Camera Rotation
                    const moveAngle = joystickData.angle + camRot.y + (Math.PI / 2);

                    const speed = CONFIG.walkSpeed * delta * joystickData.force;

                    player.position.x -= Math.cos(moveAngle) * speed;
                    player.position.z -= Math.sin(moveAngle) * speed;

                    // Player ko chalne ki disha mein ghumayein
                    player.rotation.y = moveAngle + Math.PI; 
                }

                if(mixer) mixer.update(delta);

                // Update Camera Position (Third Person)
                // Camera player ke peeche (offset) set karein
                const hDist = camDist * Math.cos(camRot.x); // Horizontal distance
                const vDist = camDist * Math.sin(camRot.x); // Vertical height

                const camX = player.position.x + (hDist * Math.sin(camRot.y));
                const camZ = player.position.z + (hDist * Math.cos(camRot.y));
                const camY = player.position.y + 2 + (vDist * -1); // +2 player ki height ke liye

                // Smooth Camera (Lerp)
                camera.position.x += (camX - camera.position.x) * 0.1;
                camera.position.z += (camZ - camera.position.z) * 0.1;
                camera.position.y += (camY - camera.position.y) * 0.1;

                camera.lookAt(player.position.x, player.position.y + 1.5, player.position.z);
            }

            renderer.render(scene, camera);
        }

        // Resize Handle
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
