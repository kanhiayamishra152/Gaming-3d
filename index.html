<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Model Debugger</title>
    <style>
        body { margin: 0; overflow: hidden; background: #333; font-family: monospace; }
        
        /* Message Box for Status */
        #status-box {
            position: absolute; top: 10px; left: 10px; width: 90%;
            background: rgba(0, 0, 0, 0.8); color: lime;
            padding: 10px; border-radius: 8px; pointer-events: none;
            white-space: pre-wrap; font-size: 14px; z-index: 100;
        }
        .error { color: #ff5555; font-weight: bold; }
        .success { color: #55ff55; }
        .info { color: #aaaaff; }

        /* Controls */
        #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; z-index: 50; }
        #look-zone { position: absolute; top: 0; right: 0; width: 50%; height: 100%; z-index: 50; }
    </style>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>
</head>
<body>

    <div id="status-box">Initializing System...</div>
    <div id="joystick-zone"></div>
    <div id="look-zone"></div>

    <script>
        // --- 1. CONFIGURATION (NAAM YAHAN CHECK KAREIN) ---
        const FILES = {
            city: 'futuristic_city.glb',    // File name check karein (case sensitive!)
            player: 'soldier_human.glb'     // File name check karein
        };

        // --- 2. LOGGING SYSTEM ---
        const statusBox = document.getElementById('status-box');
        function log(msg, type = 'info') {
            console.log(msg);
            const line = document.createElement('div');
            line.textContent = `> ${msg}`;
            line.className = type;
            statusBox.appendChild(line);
        }

        // --- 3. BASIC SCENE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x808080); // Grey background taaki model dikhe

        // Helpers (Grid aur Axis taaki pata chale zameen kahan hai)
        const grid = new THREE.GridHelper(100, 100);
        scene.add(grid);
        const axes = new THREE.AxesHelper(5); // Red=X, Green=Y, Blue=Z
        scene.add(axes);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting (Boht tez light taaki sab dikhe)
        const ambLight = new THREE.AmbientLight(0xffffff, 1);
        scene.add(ambLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // --- 4. ASSET LOADER WITH AUTO-SCALE ---
        const loader = new THREE.GLTFLoader();
        let playerMesh = null;
        let mixer = null;
        
        // Function: Load and Auto-Fix Model
        function loadModel(name, url, isPlayer) {
            log(`Starting download: ${url}...`, 'info');
            
            loader.load(url, (gltf) => {
                const model = gltf.scene;
                
                // --- AUTO SCALING MAGIC ---
                // Model ka asli size nikalna
                const box = new THREE.Box3().setFromObject(model);
                const size = new THREE.Vector3();
                box.getSize(size);
                
                log(`✅ ${name} Loaded! Original Size: ${size.x.toFixed(2)}, ${size.y.toFixed(2)}`, 'success');

                if (size.length() === 0) {
                    log(`⚠️ Warning: ${name} is empty (0 size)!`, 'error');
                    return;
                }

                // Model ko Center karna
                const center = new THREE.Vector3();
                box.getCenter(center);
                model.position.sub(center); // Center to (0,0,0)

                // Scale Logic (Agar model bohot bada ya chota hai to fix karo)
                const targetSize = isPlayer ? 2 : 50; // Player 2m uncha, City 50m
                const maxDim = Math.max(size.x, size.y, size.z);
                const scaleFactor = targetSize / maxDim;
                
                model.scale.setScalar(scaleFactor);
                
                // Position fix
                if(isPlayer) {
                    model.position.y = 0; // Zameen par
                    playerMesh = model;
                    
                    // Add simple animation if available
                    if(gltf.animations.length > 0) {
                        mixer = new THREE.AnimationMixer(playerMesh);
                        mixer.clipAction(gltf.animations[0]).play();
                    }
                } else {
                    model.position.y = -1; // City thoda neeche
                }

                scene.add(model);
                log(`${name} Rescaled & Added to Scene.`, 'success');

            }, 
            undefined, // Progress
            (error) => {
                log(`❌ ERROR: Could not load ${name} (${url})`, 'error');
                log(`Tip: Check spelling or folder location.`, 'error');
                
                // Fallback Box only for player
                if(isPlayer) {
                    const boxGeo = new THREE.BoxGeometry(1, 2, 1);
                    const boxMat = new THREE.MeshBasicMaterial({color: 'red', wireframe: true});
                    playerMesh = new THREE.Mesh(boxGeo, boxMat);
                    scene.add(playerMesh);
                }
            });
        }

        // Start Loading
        loadModel("Map (City)", FILES.city, false);
        loadModel("Player", FILES.player, true);

        // --- 5. CONTROLS ---
        let joystickData = { angle: 0, force: 0 };
        let camRot = { x: -0.5, y: 0 };
        const camDist = 5;

        // Joystick
        const joystick = nipplejs.create({
            zone: document.getElementById('joystick-zone'),
            mode: 'static',
            position: { left: '50%', top: '50%' },
            color: 'cyan'
        });
        joystick.on('move', (evt, data) => {
            joystickData.angle = data.angle.radian;
            joystickData.force = Math.min(data.force, 1);
        });
        joystick.on('end', () => { joystickData.force = 0; });

        // Touch Look
        const lookZone = document.getElementById('look-zone');
        let prevTouch = { x: 0, y: 0 };
        lookZone.addEventListener('touchstart', e => {
            prevTouch.x = e.touches[0].clientX;
            prevTouch.y = e.touches[0].clientY;
        });
        lookZone.addEventListener('touchmove', e => {
            const x = e.touches[0].clientX;
            const y = e.touches[0].clientY;
            camRot.y -= (x - prevTouch.x) * 0.005;
            camRot.x -= (y - prevTouch.y) * 0.005;
            prevTouch = {x, y};
        });

        // Loop
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (playerMesh) {
                if (joystickData.force > 0) {
                    const moveAngle = joystickData.angle + camRot.y + Math.PI/2;
                    const speed = 5 * delta;
                    playerMesh.position.x -= Math.cos(moveAngle) * speed;
                    playerMesh.position.z -= Math.sin(moveAngle) * speed;
                    playerMesh.rotation.y = moveAngle + Math.PI;
                }
                
                // Camera Follow
                const cx = playerMesh.position.x + camDist * Math.sin(camRot.y);
                const cz = playerMesh.position.z + camDist * Math.cos(camRot.y);
                camera.position.set(cx, playerMesh.position.y + 3, cz);
                camera.lookAt(playerMesh.position);
            }
            
            if(mixer) mixer.update(delta);
            renderer.render(scene, camera);
        }
        animate();

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
